<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classroom Engagement Pulse</title>
<style>
:root{--bg:#0e1117;--card:#171c24;--line:#2a3240;--tx:#eef2f7;--mu:#9aa6b5;--g:#39d98a;--y:#f2b84b;--r:#ff6b6b;--ac:#7aa2ff}
@media(prefers-color-scheme:light){:root{--bg:#f4f7fb;--card:#fff;--line:#d9dde4;--tx:#172033;--mu:#5d6675;--g:#16a34a;--y:#b7791f;--r:#dc2626;--ac:#2563eb}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:14px;max-width:980px;margin-inline:auto}
h1{font-size:1.35rem;margin:0 0 4px}h2{font-size:1rem;margin:0 0 10px}.mu{color:var(--mu);font-size:.88rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.g2{grid-template-columns:1fr}}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 14px;background:var(--ac);color:#fff;margin:3px 3px 3px 0;cursor:pointer}
button.s{background:var(--line);color:var(--tx)}button:disabled{opacity:.45}
input,select{font:inherit;width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--tx);margin:4px 0 8px}
label{font-size:.85rem;color:var(--mu)}.big{font-size:3rem;font-weight:800;line-height:1}
.m{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}.m:last-child{border:0}
canvas{width:100%;height:190px;border-radius:10px;background:var(--bg)}.ok{color:var(--g)}.bad{color:var(--r)}
.vb button{width:100%;font-size:1.3rem;padding:20px;margin:6px 0}.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--y);color:#000;font-size:.8rem;font-weight:700}
.qr{display:flex;gap:18px;flex-wrap:wrap}.qr>div{word-break:break-all;font-size:.75rem;max-width:270px}.qb{background:#fff;padding:14px;display:inline-block;border-radius:10px;margin:6px 0}
</style></head><body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),Q=new URLSearchParams(location.search),app=$('app');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const sd=a=>{if(a.length<2)return 0;const m=avg(a);return Math.sqrt(avg(a.map(v=>(v-m)**2)))};
const runs=f=>{const o=[];let n=0;for(const x of f){if(x)n++;else{if(n)o.push(n);n=0}}if(n)o.push(n);return o};
/* OPTIONAL: paste your Firebase URL between the quotes, then re-upload. Links and QR codes become much shorter. */
const DEFAULT_DB='';
let cfg={};try{cfg=JSON.parse(localStorage.getItem('cfg')||'{}')}catch(e){}
const room=(Q.get('room')||cfg.room||Math.random().toString(36).slice(2,6)).toUpperCase();
const rawdb=(Q.get('db')||cfg.db||DEFAULT_DB).trim().replace(/\/+$/,''),db=!rawdb||/^https?:/.test(rawdb)?rawdb:'https://'+rawdb,role=Q.get('role');
const storedAppUrl=(()=>{try{return localStorage.getItem('appUrl')||''}catch(e){return''}})();
const pageBase=location.href.split('?')[0];
const base=/^https:\/\//i.test(pageBase)||/^http:\/\//i.test(pageBase)?pageBase:'';
const appBase=storedAppUrl.replace(/\/?$/,'')||base;
const link=r=>appBase+'?role='+r+'&room='+room+(db&&db!==DEFAULT_DB?'&db='+encodeURIComponent(db.replace(/^https:\/\//,'')):'');
let tok;try{tok=localStorage.getItem('tok')||Math.random().toString(36).slice(2);localStorage.setItem('tok',tok)}catch(e){tok=Math.random().toString(36).slice(2)}

/* ---------- shared store: local memory, mirrored to Firebase REST when a URL is set ---------- */
const S={feat:{},votes:{},obs:{},pulse:null};let seq=0;
const U=p=>db+'/rooms/'+room+(p?'/'+p:'')+'.json';
const net=t=>{const e=$('net');if(e){e.textContent=t;e.className=t==='live'?'ok':'bad'}};
async function send(c,o){
 if(c==='pulse')S.pulse=o;else S[c]['L'+seq++]=o;
 if(!db)return;
 try{await fetch(U(c),{method:c==='pulse'?'PUT':'POST',body:JSON.stringify(o)});net('live')}catch(e){net('offline')}}
async function pull(){if(!db)return;try{const d=await(await fetch(U(''))).json()||{};S.feat=d.feat||{};S.votes=d.votes||{};S.obs=d.obs||{};S.pulse=d.pulse||null;net('live')}catch(e){net('offline')}}

/* ---------- microphone sensor: 50 ms steps -> 1 s frames -> 30 s feature row (no audio kept) ---------- */
async function sensor(dev,pos,cb){
 const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});
 const ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();
 const an=ctx.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=0;ctx.createMediaStreamSource(st).connect(an);
 const td=new Float32Array(2048),fd=new Float32Array(1024),bh=ctx.sampleRate/2048,lo=Math.max(1,Math.round(300/bh)),hi=Math.min(1023,Math.round(3400/bh));
 try{await navigator.wakeLock.request('screen')}catch(e){}
 const vh=[];let sub={n:0,r:0,f:0,s:0},t=performance.now(),floor=null,sc=0,win=[],t0=0,rows=0;
 setInterval(()=>{
  an.getFloatTimeDomainData(td);an.getFloatFrequencyData(fd);
  let sq=0;for(let i=0;i<2048;i++)sq+=td[i]*td[i];
  const rdb=Math.max(-100,20*Math.log10(Math.sqrt(sq/2048)||1e-9));
  let sp=0,sl=0,n=0;for(let k=lo;k<=hi;k++){const p=Math.max(10**(fd[k]/10),1e-12);sp+=p;sl+=Math.log(p);n++}
  const vdb=10*Math.log10(sp/n),flat=Math.exp(sl/n)/(sp/n);
  vh.push(vdb);if(vh.length>1200)vh.shift();
  const speech=floor!==null&&vdb>floor+10;
  sub.n++;sub.r+=rdb;sub.f+=flat;if(speech)sub.s++;
  cb({db:rdb,speech:floor===null?null:speech,rows,left:win.length?30-win.length:null});
  if(performance.now()-t>=1000){
   t+=1000;sc++;const sec={r:sub.r/sub.n,f:sub.f/sub.n,s:sub.s/sub.n};sub={n:0,r:0,f:0,s:0};
   if(vh.length>=60)floor=[...vh].sort((a,b)=>a-b)[Math.floor(.1*vh.length)];
   if(sc>3&&floor!==null){
    if(!win.length)t0=Date.now();win.push(sec);
    if(win.length>=30){
     const rs=win.map(x=>x.r),spv=win.map(x=>x.s),br=runs(spv.map(v=>v>=.5)),si=runs(spv.map(v=>v<.2)),r3=x=>Math.round(x*1000)/1000;
     send('feat',{session_id:room,device_id:dev,mic_position:pos,timestamp:new Date(t0).toISOString(),ts:Date.now(),rms_mean:r3(avg(rs)),rms_std:r3(sd(rs)),rms_max:r3(Math.max(...rs)),
      speech_ratio:r3(avg(spv)),longest_silence_s:si.length?Math.max(...si):0,burst_count:br.length,burst_len_mean:r3(br.length?avg(br):0),flatness:r3(avg(win.map(x=>x.f)))});
     win=[];rows++}}}
 },50)}

/* ---------- indicator: interpretable starter rule, to be calibrated against votes ---------- */
function score(f){
 const turn=clamp(f.burst_count/5,0,1),act=clamp(1-Math.abs(f.speech_ratio-.55)/.55,0,1),dyn=clamp(f.rms_std/8,0,1),
 bab=clamp((f.speech_ratio-.7)/.3,0,1)*clamp(1-f.rms_std/6,0,1)*clamp(f.flatness/.4,0,1),dead=clamp((f.longest_silence_s-10)/20,0,1);
 return 100*clamp(.4*turn+.3*act+.3*dyn-.35*bab-.3*dead,0,1)}
const band=v=>v>=60?'High':v>=35?'Medium':'Low',col=v=>v>=60?'var(--g)':v>=35?'var(--y)':'var(--r)';
function windows(){
 const m={};Object.values(S.feat).forEach(f=>{const k=Math.floor(f.ts/30000);(m[k]=m[k]||[]).push(f)});
 const V=Object.values(S.votes),O=Object.values(S.obs);
 return Object.keys(m).map(Number).sort((a,b)=>a-b).map(k=>{
  const r=m[k],t=k*30000,F=n=>avg(r.map(x=>x[n])),w={t,dev:r.length};
  ['rms_mean','rms_std','speech_ratio','longest_silence_s','burst_count','burst_len_mean','flatness'].forEach(n=>w[n]=F(n));
  w.score=avg(r.map(score));
  const vs=V.filter(v=>v.ts>=t-30000&&v.ts<t+30000).map(v=>(v.v-1)*50),ob=O.filter(o=>o.ts>=t-30000&&o.ts<t+120000).map(o=>o.v);
  w.vote=vs.length?avg(vs):null;w.vn=vs.length;w.obs=ob.length?avg(ob):null;return w})}

/* ---------- pages ---------- */
function landing(){
 app.innerHTML=`<h1>Classroom Engagement Pulse</h1><p class="mu">Privacy-first: sound is turned into numbers on the phone. No audio, video or names are stored.</p>
 <div class="card"><label>Room code</label><input id="rm" value="${room}"><label>Firebase Realtime Database URL (optional, enables students and extra phones)</label>
 <input id="dbu" placeholder="https://your-project-default-rtdb.firebaseio.com" value="${db}">
 <button data-r="teacher">Teacher dashboard</button><button class="s" data-r="sensor">Sensor phone</button><button class="s" data-r="student">Student view</button>
 <p class="mu">Without a database URL everything runs on this one device. With it, students vote from their own phones and extra phones act as sensors.</p></div>`;
 app.querySelectorAll('button').forEach(b=>b.onclick=()=>{const r=$('rm').value.trim().toUpperCase()||room,d=$('dbu').value.trim();
  try{localStorage.setItem('cfg',JSON.stringify({room:r,db:d}))}catch(e){}
  location.href=base+'?role='+b.dataset.r+'&room='+r+(d?'&db='+encodeURIComponent(d):'')})}

function sensorPage(){
 app.innerHTML=`<h1>Sensor phone</h1><p class="mu">Room ${room}. Sends only numbers every 30 s. Keep plugged in, screen on.</p>
 <div class="card"><label>Device name</label><input id="dv" value="phone1"><label>Position</label><select id="ps"><option>front</option><option>middle</option><option>back</option></select>
 <button id="go">Start listening</button><p id="er" class="bad"></p></div>
 <div class="card"><div class="big" id="lv">--</div><div class="mu">dBFS</div><div class="m"><span>Speech now</span><b id="sp">--</b></div><div class="m"><span>Next row in</span><b id="lf">--</b></div><div class="m"><span>Rows sent</span><b id="rw">0</b></div><div class="m"><span>Sync</span><b id="net">${db?'...':'local only'}</b></div></div>`;
 $('go').onclick=async()=>{try{await sensor($('dv').value,$('ps').value,sensorUI);$('go').disabled=true}catch(e){$('er').textContent='Microphone failed ('+e.name+'). Open this page over https in Chrome or Safari and allow the mic.'}}}
function sensorUI(o){$('lv').textContent=o.db.toFixed(0);$('sp').textContent=o.speech===null?'calibrating':o.speech?'yes':'no';$('lf').textContent=o.left===null?'calibrating':o.left+' s';$('rw').textContent=o.rows}

function studentPage(){
 app.innerHTML=`<h1>How are you following?</h1><p class="mu">Anonymous. No name, one tap. Your answer helps the teacher, not a grade.</p>
 <div class="card" id="pm">${db?'Checking...':'Ask your teacher to turn on shared mode.'}</div>
 <div class="vb"><button data-v="1" style="background:var(--r)">😴 Lost</button><button data-v="2" style="background:var(--y);color:#000">😐 So-so</button><button data-v="3" style="background:var(--g);color:#000">👍 Following</button></div><p id="th" class="mu"></p>`;
 let open=null,last=0;
 const poll=async()=>{if(!db)return;try{const p=await(await fetch(U('pulse'))).json();open=p&&p.open?p:null;
  $('pm').innerHTML=open?'<b>Check-in is open: tap now</b>':'No check-in right now. You can still vote any time.'}catch(e){}};
 poll();setInterval(poll,2000);
 app.querySelectorAll('.vb button').forEach(b=>b.onclick=()=>{
  if(!db){$('th').textContent='Shared mode is off.';return}
  if(Date.now()-last<15000){$('th').textContent='Thanks! Wait a few seconds to vote again.';return}
  let seen='';try{seen=localStorage.getItem('lp')||''}catch(e){}
  if(open&&seen==open.id){$('th').textContent='You already answered this check-in. Thank you!';return}
  last=Date.now();try{if(open)localStorage.setItem('lp',open.id)}catch(e){}
  send('votes',{ts:Date.now(),v:+b.dataset.v,pulse:open?open.id:0,tok});$('th').textContent='Thank you! Recorded anonymously.'})}

function teacherPage(){
 app.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Teacher dashboard</h1><div class="mu">Room ${room} · sync: <b id="net">${db?'...':'local only'}</b></div></div><button class="s" id="mic">Use this phone's mic</button></div>
 <div class="g2"><div class="card"><h2>Engagement indicator</h2><div class="big" id="sc" style="color:var(--mu)">--</div><h2 id="lab" style="margin-top:8px">Waiting for sensor data</h2>
 <div class="mu">A nudge to check in, not a verdict on any student.</div><div class="m"><span>Sensors reporting</span><b id="dv">0</b></div><div class="m"><span>Live level</span><b id="lv">--</b></div><div class="m"><span>Speech ratio / bursts / silence</span><b id="rd">--</b></div></div>
 <div class="card"><h2>Ground truth</h2><div class="m"><span>Class vote (latest window)</span><b id="vt">--</b></div><div class="m"><span>Indicator vs vote agreement</span><b id="ag">--</b></div>
 <p style="margin:10px 0 4px"><button id="pl">Ask students now (60 s)</button> <span class="pill" id="sg" style="display:none">Suggested</span></p><div class="mu" id="pst"></div>
 <p class="mu" style="margin:10px 0 2px">Observer rating of the last 2 minutes:</p><button class="s" data-o="1">1 Low</button><button class="s" data-o="2">2 Medium</button><button class="s" data-o="3">3 High</button>
 <div id="solo" class="mu" style="margin-top:8px"></div></div></div>
 <div class="card"><h2>Timeline (line: indicator, rings: student vote)</h2><canvas id="tl" width="900" height="190"></canvas></div>
 <div class="g2"><div class="card"><h2>Join links</h2>${appBase&&/^https:\/\//i.test(appBase)?'':'<p class="bad"><b>QR links are not ready:</b> open this app from a public HTTPS address (not file:// or localhost), then reload.</p>'}<div class="qr"><div><b>Students</b><br><div class="qb" id="q1"></div><br><button class="s" id="c1">Copy link</button><br><span id="l1"></span></div><div><b>Sensor phones</b><br><div class="qb" id="q2"></div><br><button class="s" id="c2">Copy link</button><br><span id="l2"></span></div></div>
 ${db?'':'<p class="mu">Add a Firebase URL on the start page so these links work on other phones.</p>'}</div>
 <div class="card"><h2>Export for analysis</h2><button id="e1">Windows + labels CSV</button><button class="s" id="e2">Raw sensor rows CSV</button><p class="mu">Use these in the Python pipeline. Indicator rule is a starter; check agreement before trusting it.</p></div></div>`;
 const qr=(id,t)=>{const e=$(id);if(!t||!/^https:\/\//i.test(t)){e.innerHTML='<span style="color:#000">Set a public HTTPS app URL on the start page first.</span>';return}if(window.QRCode)new QRCode(e,{text:t,width:230,height:230,correctLevel:QRCode.CorrectLevel.M});else e.innerHTML='<span style="color:#000">QR library did not load. Use Copy link below.</span>'};
 qr('q1',link('student'));qr('q2',link('sensor'));$('l1').textContent=link('student');$('l2').textContent=link('sensor');
 const cp=(b,t)=>$(b).onclick=async()=>{try{await navigator.clipboard.writeText(t);$(b).textContent='Copied!'}catch(e){$(b).textContent='Select the link below and copy'}};cp('c1',link('student'));cp('c2',link('sensor'));
 let pcs=[],lvOn=false;
 $('mic').onclick=async()=>{try{await sensor('teacher','front',o=>{$('lv').textContent=o.db.toFixed(0)+' dBFS'});$('mic').disabled=true}catch(e){alert('Microphone failed ('+e.name+'). Use https and allow the mic.')}};
 $('pl').onclick=()=>{const id=Date.now();pcs.push(id);send('pulse',{id,open:true});$('pl').disabled=true;
  setTimeout(()=>{send('pulse',{id,open:false});$('pl').disabled=false},60000)};
 app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>send('obs',{ts:Date.now(),v:+b.dataset.o}));
 if(!db)$('solo').innerHTML='Solo mode: count hands. <button class="s" data-t="1">+ Lost</button><button class="s" data-t="2">+ So-so</button><button class="s" data-t="3">+ Following</button>',
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>send('votes',{ts:Date.now(),v:+b.dataset.t,pulse:0,tok:'hand'}));
 const csv=(rows,cols)=>[cols.join(','),...rows.map(r=>cols.map(c=>JSON.stringify(r[c]??'')).join(','))].join('\n');
 const dl=(n,t)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=n;a.click()};
 $('e1').onclick=()=>dl('windows_'+room+'.csv',csv(windows().map(w=>({...w,time:new Date(w.t).toISOString(),indicator:band(w.score),vote_pct:w.vote,vote_n:w.vn,observer_1to3:w.obs})),
  ['time','dev','rms_mean','rms_std','speech_ratio','longest_silence_s','burst_count','burst_len_mean','flatness','score','indicator','vote_pct','vote_n','observer_1to3']));
 $('e2').onclick=()=>dl('sensor_rows_'+room+'.csv',csv(Object.values(S.feat),['session_id','device_id','mic_position','timestamp','ts','rms_mean','rms_std','rms_max','speech_ratio','longest_silence_s','burst_count','burst_len_mean','flatness']));
 function ui(){
  const W=windows(),now=Date.now(),lastBy={};
  Object.values(S.feat).forEach(f=>{if(now-f.ts<90000&&(!lastBy[f.device_id]||f.ts>lastBy[f.device_id].ts))lastBy[f.device_id]=f});
  const L=Object.values(lastBy);$('dv').textContent=L.length;
  if(L.length){const s=avg(L.map(score));$('sc').textContent=Math.round(s)+'%';$('sc').style.color=col(s);$('lab').textContent=band(s)+' engagement (sound-based)';$('lab').style.color=col(s);
   $('rd').textContent=(avg(L.map(f=>f.speech_ratio))*100).toFixed(0)+'% / '+avg(L.map(f=>f.burst_count)).toFixed(0)+' / '+Math.max(...L.map(f=>f.longest_silence_s))+' s'}
  const wv=W.filter(w=>w.vote!==null),lv=wv[wv.length-1];
  $('vt').textContent=lv?Math.round(lv.vote)+'% following (n='+lv.vn+')':'no votes yet';
  $('ag').textContent=wv.length?wv.filter(w=>band(w.score)===band(w.vote)).length+' of '+wv.length+' windows':'--';
  const last=W[W.length-1],prev=W[W.length-2],ok=pcs.length<4&&(!pcs.length||now-pcs[pcs.length-1]>600000);
  $('sg').style.display=ok&&last&&((last.score>=35&&last.score<60)||(prev&&prev.score-last.score>25))?'inline-block':'none';
  $('pst').textContent='Check-ins sent: '+pcs.length+' of 4 suggested max. Keep at least 10 minutes between them.';
  const c=$('tl'),g=c.getContext('2d'),w=c.width,h=c.height,cs=getComputedStyle(document.documentElement);g.clearRect(0,0,w,h);
  [[60,100,'--g'],[35,60,'--y'],[0,35,'--r']].forEach(b=>{g.globalAlpha=.08;g.fillStyle=cs.getPropertyValue(b[2]);g.fillRect(0,h-b[1]/100*h,w,(b[1]-b[0])/100*h);g.globalAlpha=1});
  const D=W.slice(-40),X=i=>D.length<2?w/2:20+i*(w-40)/(D.length-1),Y=v=>h-10-v/100*(h-20);
  g.strokeStyle=cs.getPropertyValue('--ac');g.lineWidth=3;g.beginPath();D.forEach((d,i)=>i?g.lineTo(X(i),Y(d.score)):g.moveTo(X(i),Y(d.score)));g.stroke();
  D.forEach((d,i)=>{g.fillStyle=col(d.score).replace(/var\((.*)\)/,(m,v)=>cs.getPropertyValue(v));g.beginPath();g.arc(X(i),Y(d.score),4,0,7);g.fill();
   if(d.vote!==null){g.strokeStyle=cs.getPropertyValue('--tx');g.lineWidth=2;g.beginPath();g.arc(X(i),Y(d.vote),8,0,7);g.stroke()}})}
 const tick=async()=>{await pull();ui()};tick();setInterval(tick,3000);setInterval(ui,1000)}

if(role==='teacher')teacherPage();else if(role==='sensor')sensorPage();else if(role==='student')studentPage();else landing();
})();
</script></body></html>
